# ==============================================================================
# GravityOptions - Automated Options Buying System Configuration
# ==============================================================================

system:
  mode: "paper"              # "paper" or "live"
  broker: "angelone"         # "dhan", "angelone", or "mock" (Switch to "dhan" once subscribed)
  timezone: "Asia/Kolkata"
  trading_start_time: "09:15"
  entry_start_time: "09:30"   # Buffer morning opening gap whipsaws (09:15-09:30); active entries begin at 09:30 IST
  intraday_exit_time: "15:15"
  market_close_time: "15:30"
  stagnation_timeout_mins: 20 # Exit option if no favorable move in 20 mins (anti-theta)
  candle_interval: "5m"       # "3m" or "5m" for fast options momentum (was 15m)
  trade_cooldown_mins: 15     # 15m cooldown after trade exit to avoid chop re-entry
  midday_pause:
    enabled: true             # Pause new entries during low-volume lunchtime chop
    start_time: "11:30"       # Freeze new entries at 11:30 IST
    resume_time: "13:15"      # Resume entries at 13:15 IST (afternoon European open window)
  web_report_path: "/home/gravitywork/public_html/index.html" # Automatically update website!


# Broker API Credentials (Keep secure)
credentials:
  dhan:
    client_id: "YOUR_DHAN_CLIENT_ID"          # 10-digit Dhan Client ID
    access_token: "YOUR_DHAN_ACCESS_TOKEN"    # Generate static API token from https://web.dhan.co/ -> APIs
  angelone:
    client_id: "YOUR_ANGEL_CLIENT_ID"
    pin_or_password: "YOUR_PASSWORD_OR_PIN"
    api_key: "YOUR_SMARTAPI_API_KEY"
    totp_secret: "YOUR_TOTP_KEY_FOR_AUTO_LOGIN"  # Generated when setting up TOTP

# Indices Configuration (Toggle on/off as desired)
indices:
  NIFTY:
    enabled: true
    exchange: "NSE"
    spot_symbol: "Nifty 50"
    lot_size: 25
    strike_step: 50
    fixed_lots: 1
    max_lots: 5
    atm_offset: 0            # 0 = ATM, -1 = 1 strike ITM for Call / OTM for Put
    prefer_itm_delta: 0.75   # Target delta between 0.70 and 0.80 for deep ITM
    strike_mode: "deep_itm"  # Options: "deep_itm" (2 strikes ITM for high Delta/low theta) or "atm"
    itm_depth: 2             # 2 strikes ITM (~100 pts on Nifty)

  BANKNIFTY:
    enabled: false           # Disabled: 0% win rate recently (-₹4,665 vs NIFTY +₹2,316); focus on NIFTY weekly liquidity
    exchange: "NSE"
    spot_symbol: "Nifty Bank"
    lot_size: 15
    strike_step: 100
    fixed_lots: 1
    max_lots: 1              # Strictly pinned to 1 lot max (15 qty) for controlled risk
    atm_offset: 0
    prefer_itm_delta: 0.55

  SENSEX:
    enabled: false           # Set false: Angel One SmartAPI getCandleData does not support BSE index historical candles
    exchange: "BSE"
    spot_symbol: "SENSEX"
    lot_size: 10
    strike_step: 100
    fixed_lots: 1
    max_lots: 4
    atm_offset: 0
    prefer_itm_delta: 0.55

  FINNIFTY:
    enabled: false           # Toggle true whenever you want to trade FinNifty
    exchange: "NSE"
    spot_symbol: "Nifty Fin Service"
    lot_size: 25
    strike_step: 50
    fixed_lots: 1
    max_lots: 4
    atm_offset: 0
    prefer_itm_delta: 0.55

# Stock Options Screener & Universe Configuration
stocks:
  enabled: false             # Kept false for today on Angel One; will enable on Wednesday with DhanHQ
  scan_interval_seconds: 30  # Scan stock universe every 30 seconds
  # High-Beta Momentum F&O Runners + Core Large-caps
  universe:
    # High-Alpha F&O Momentum Rockets (Proven Multi-bagger Runners)
    - "SUPREMEIND"
    - "BOSCHLTD"
    - "SOLARINDS"
    - "DIXON"
    - "TRENT"
    - "MCX"
    - "POLYCAB"
    - "POLICYBZR"
    - "TVSMOTOR"
    - "HEROMOTOCO"
    - "HAL"
    - "BEL"
    # Core High-Volume F&O Large-Caps
    - "RELIANCE"
    - "ICICIBANK"
    - "SBIN"
    - "BHARTIARTL"
    - "TATAMOTORS"
    - "M&M"

  fixed_lots: 1
  min_rvol: 1.5              # Relative volume multiplier required to qualify
  min_atr_pct: 1.2           # Minimum daily ATR percentage for momentum
  carry_forward:
    enabled: true            # Allow overnight hold if criteria pass
    min_profit_pct: 15.0     # Must be in >= 15% profit to carry overnight
    min_days_to_expiry: 7    # Avoid carry forward in expiry week (physical delivery risk)

# Market Regime & Volatility Filters (ADX Trend vs Non-Trending Chop Protection)
market_regime:
  adx_period: 14             # Welles Wilder 14-period ADX
  min_adx: 22.0              # Strict gate: ADX < 22 = Stand-down (No option buying in chop)
  check_di_alignment: true   # Require +DI > -DI for Call options, -DI > +DI for Put options
  multi_day_range_filter: true # Block breakouts inside middle of multi-day range box when ADX < 25

# Open Interest (OI) & Institutional Order Flow Conviction Gate (MrChartist Model)
oi_analysis:
  enabled: true
  min_conviction_score: 40     # Minimum Institutional Conviction (0-100) required to open trade (tuned for Angel One static OI + short-covering rallies)
  min_pcr_for_call: 0.75      # Minimum PCR required to take a BUY_CALL (allows short-covering rallies while rejecting extreme <0.75 call traps)
  max_pcr_for_put: 1.15       # Maximum PCR required to take a BUY_PUT (rejects put traps)
  min_distance_to_wall: 25.0  # Minimum buffer (points) from Call Wall/Put Wall to avoid slamming into resistance/support
  num_strikes_each_side: 8    # Strikes above and below ATM to analyze (17 strikes total for wider OI Walls & GEX)
  cache_seconds: 60           # Cache OI metrics for 60 seconds

# Phase 3: Volatility, Expected Move & Delta-Targeted Strike Selection (Option Hub model)
volatility_guard:
  enabled: true
  max_expected_move_consumed_pct: 90.0  # Block late entries if spot already moved >= 90% of 1-day 1σ Expected Move from open
  max_iv_hv_ratio: 1.60                 # Block option buying when ATM IV > 1.60x realised HV (IV crush risk)
  use_delta_strike_selection: true      # Dynamically pick strike matching prefer_itm_delta instead of static ±2 offset

# Position Sizing & Money Management
position_sizing:
  mode: "fixed_lots"         # Options: "fixed_lots" or "risk_percentage"
  risk_per_trade_pct: 1.5    # Percentage of virtual/live capital at risk per trade
  virtual_capital: 200000.0  # Initial paper trading account balance (INR 2,00,000)

# Risk Management & Circuit Breakers (Expanded for active research & rich data gathering)
risk:
  max_daily_loss_inr: 15000.0 # Hard daily loss cutoff across all trades (7.5% of 2L)
  max_open_trades: 8          # Max concurrent active trades (expanded from 3 to 8 for broad market capture)
  max_daily_trades: 20        # Hard limit on total trades per day (expanded from 5 to 20 for data gathering)
  max_trades_per_symbol: 3    # Max trades allowed on a single symbol per day
  stop_loss_pct: 15.0        # Default stop-loss on option premium (15%)
  target_profit_pct: 25.0    # Responsive target profit on option premium (tuned from 35% to 25% for low/normal VIX regimes)
  trail_sl_trigger_pct: 12.0 # Move SL to breakeven once profit reaches 12%
  trail_step_pct: 8.0        # Subsequent trailing step (8% steps)

  # High-Watermark Peak Profit Protection (Guarantees windfall gains aren't wiped out by one red candle)
  peak_protect:
    enabled: true             # Toggle on/off: True = protect profits from peak; False = classic step trailing
    trigger_pct: 18.0         # Activate peak trailing once option reaches >= +18% gain
    lock_in_min_pct: 10.0     # Guarantee at least +10% profit locked in at trigger
    giveback_pct: 7.0         # Maximum allowed pullback from peak price (7% giveback ceiling)

# Paper Trading Cost Simulation (Indian Taxes & Charges)
paper_simulation:
  brokerage_per_order_inr: 20.0 # Flat 20/order
  stt_pct_on_sell: 0.10         # 0.1% on option sell turnover (revised rate)
  exchange_turnover_pct: 0.05   # NSE turnover charges
  gst_pct: 18.0                 # 18% GST on brokerage + exchange
  sebi_charges_per_crore: 10.0
  stamp_duty_pct_on_buy: 0.003  # 0.003% on buy
  slippage_points: 0.5          # Average simulated fill slippage
