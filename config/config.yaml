# ==============================================================================
# GravityOptions - Automated Options Buying System Configuration
# ==============================================================================

system:
  mode: "paper"              # "paper" or "live"
  broker: "angelone"         # "angelone", "upstox", or "mock"
  timezone: "Asia/Kolkata"
  trading_start_time: "09:15"
  intraday_exit_time: "15:15"
  market_close_time: "15:30"
  stagnation_timeout_mins: 20 # Exit option if no favorable move in 20 mins (anti-theta)
  candle_interval: "5m"       # "3m" or "5m" for fast options momentum (was 15m)
  trade_cooldown_mins: 15     # 15m cooldown after trade exit to avoid chop re-entry
  web_report_path: "/home/gravitywork/public_html/index.html" # Automatically update website!


# Broker API Credentials (Keep secure)
credentials:
  angelone:
    client_id: "YOUR_ANGEL_CLIENT_ID"
    pin_or_password: "YOUR_PASSWORD_OR_PIN"
    api_key: "YOUR_SMARTAPI_API_KEY"
    totp_secret: "YOUR_TOTP_KEY_FOR_AUTO_LOGIN"  # Generated when setting up TOTP

# Indices Configuration (Toggle on/off as desired)
indices:
  NIFTY:
    enabled: true
    exchange: "NSE"
    spot_symbol: "Nifty 50"
    lot_size: 25
    strike_step: 50
    fixed_lots: 1
    max_lots: 5
    atm_offset: 0            # 0 = ATM, -1 = 1 strike ITM for Call / OTM for Put
    prefer_itm_delta: 0.55   # Target delta between 0.50 and 0.65

  BANKNIFTY:
    enabled: true
    exchange: "NSE"
    spot_symbol: "Nifty Bank"
    lot_size: 15
    strike_step: 100
    fixed_lots: 1
    max_lots: 4
    atm_offset: 0
    prefer_itm_delta: 0.55

  SENSEX:
    enabled: false           # Set false: Angel One SmartAPI getCandleData does not support BSE index historical candles
    exchange: "BSE"
    spot_symbol: "SENSEX"
    lot_size: 10
    strike_step: 100
    fixed_lots: 1
    max_lots: 4
    atm_offset: 0
    prefer_itm_delta: 0.55

  FINNIFTY:
    enabled: false           # Toggle true whenever you want to trade FinNifty
    exchange: "NSE"
    spot_symbol: "Nifty Fin Service"
    lot_size: 25
    strike_step: 50
    fixed_lots: 1
    max_lots: 4
    atm_offset: 0
    prefer_itm_delta: 0.55

# Stock Options Screener & Universe Configuration
stocks:
  enabled: true
  # High-Beta Momentum F&O Runners + Core Large-caps
  universe:
    # High-Alpha F&O Momentum Rockets (Proven Multi-bagger Runners)
    - "SUPREMEIND"
    - "BOSCHLTD"
    - "SOLARINDS"
    - "DIXON"
    - "TRENT"
    - "MCX"
    - "POLYCAB"
    - "POLICYBZR"
    - "TVSMOTOR"
    - "HEROMOTOCO"
    - "HAL"
    - "BEL"
    # Core High-Volume F&O Large-Caps
    - "RELIANCE"
    - "ICICIBANK"
    - "SBIN"
    - "BHARTIARTL"
    - "TATAMOTORS"
    - "M&M"

  fixed_lots: 1
  min_rvol: 1.5              # Relative volume multiplier required to qualify
  min_atr_pct: 1.2           # Minimum daily ATR percentage for momentum
  carry_forward:
    enabled: true            # Allow overnight hold if criteria pass
    min_profit_pct: 15.0     # Must be in >= 15% profit to carry overnight
    min_days_to_expiry: 7    # Avoid carry forward in expiry week (physical delivery risk)

# Open Interest (OI) & Put-Call Ratio (PCR) Institutional Sentiment Gate
oi_analysis:
  enabled: true
  min_pcr_for_call: 0.90      # Minimum PCR required to take a BUY_CALL (rejects call traps)
  max_pcr_for_put: 1.15       # Maximum PCR required to take a BUY_PUT (rejects put traps)
  min_distance_to_wall: 25.0  # Minimum buffer (points) from Call Wall/Put Wall to avoid slamming into resistance/support
  num_strikes_each_side: 5    # Strikes above and below ATM to analyze (11 strikes total)
  cache_seconds: 60           # Cache OI metrics for 60 seconds

# Position Sizing & Money Management
position_sizing:
  mode: "fixed_lots"         # Options: "fixed_lots" or "risk_percentage"
  risk_per_trade_pct: 1.5    # Percentage of virtual/live capital at risk per trade
  virtual_capital: 100000.0  # Initial paper trading account balance (INR)

# Risk Management & Circuit Breakers
risk:
  max_daily_loss_inr: 5000.0 # Hard daily loss cutoff across all trades
  max_open_trades: 3         # Max concurrent active trades
  max_daily_trades: 5        # Hard limit on total trades per day to prevent overtrading
  max_trades_per_symbol: 2   # Max trades allowed on a single symbol per day
  stop_loss_pct: 15.0        # Default stop-loss on option premium (e.g., 15%)
  target_profit_pct: 35.0    # First target profit on option premium (e.g., 35%)
  trail_sl_trigger_pct: 15.0 # Move SL to breakeven once profit reaches 15%
  trail_step_pct: 10.0       # Subsequent trailing step

# Paper Trading Cost Simulation (Indian Taxes & Charges)
paper_simulation:
  brokerage_per_order_inr: 20.0 # Flat 20/order
  stt_pct_on_sell: 0.10         # 0.1% on option sell turnover (revised rate)
  exchange_turnover_pct: 0.05   # NSE turnover charges
  gst_pct: 18.0                 # 18% GST on brokerage + exchange
  sebi_charges_per_crore: 10.0
  stamp_duty_pct_on_buy: 0.003  # 0.003% on buy
  slippage_points: 0.5          # Average simulated fill slippage
